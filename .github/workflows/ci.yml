name: Droidspaces CI

# One workflow. Every push and pull request builds the backend for every arch,
# the Debian packages and the APK, and uploads them as an artifact. A v* tag, or
# a manual run with tag_name, also publishes them as a GitHub release. The musl
# toolchains come from this repo's compilers-* release and are cached between
# runs. The APK is signed with the release key when the RELEASE_KEYSTORE,
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets are set, and with a
# throwaway key when they are not (a fork, a pull request).
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Publish a release for this tag (existing or new, must match DS_VERSION)"
        required: false
        type: string

permissions:
  # Needed to create the release on a tag; a pull request token is read-only regardless
  contents: write

jobs:
  build:
    name: Build Backend & Android App
    runs-on: ubuntu-latest
    env:
      # The tag being released, if any
      TAG: ${{ inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
      # The Makefile finds the toolchains in ~/toolchains/<triplet>-cross/bin
      TOOLCHAINS_URL: https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers-25843896720
      HAS_TELEGRAM: ${{ secrets.API_ID != '' && secrets.API_HASH != '' }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # One version, DS_VERSION in droidspaces.h. A tag must match it, so a
    # forgotten `make bump` fails here instead of shipping.
    - name: Settle the version
      run: |
        VERSION=$(grep "DS_VERSION" src/include/droidspaces.h | awk '{print $3}' | tr -d '"')
        if [ -n "$TAG" ]; then
          [ "${TAG#v}" = "$VERSION" ] || { echo "Tag $TAG does not match DS_VERSION $VERSION (run make bump NEW=${TAG#v})"; exit 1; }
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # The release URL names a fixed set of toolchains, so it is the whole key
    - name: Cache Toolchains
      id: toolchains
      uses: actions/cache@v4
      with:
        path: ~/toolchains
        key: musl-toolchains-${{ env.TOOLCHAINS_URL }}

    - name: Download Toolchains
      if: steps.toolchains.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        for t in aarch64-linux-musl arm-linux-musleabihf i686-linux-musl x86_64-linux-musl riscv64-linux-musl; do
          echo "[*] Downloading $t toolchain..."
          wget -q $TOOLCHAINS_URL/$t-cross.tar.zst
          tar -xf $t-cross.tar.zst && rm $t-cross.tar.zst
        done
        echo "[+] Toolchains ready."

    # Gradle's buildBackend makes the four phone arches again later, which is a
    # no-op once this has built them
    - name: Build All Tarball & Debian Packages
      run: |
        make all-tarball
        scripts/mkdeb.sh

    # The key lives in a secret as base64; without it the APK is signed with a throwaway key
    - name: Decode Keystore
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      if: env.RELEASE_KEYSTORE != ''
      run: echo "$RELEASE_KEYSTORE" | base64 -d > droidspaces.keystore

    # A release signed with a throwaway key could never update the real app, so
    # a release run without the key stops here instead of publishing one
    - name: Require the key for a release
      if: env.TAG != ''
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        [ -n "$RELEASE_KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "Releases are signed with the release key: set RELEASE_KEYSTORE and KEYSTORE_PASSWORD"; exit 1; }

    - name: Generate Contributors
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/generate_contributors.py

    - name: Build Android App with Gradle
      run: |
        cd Android
        ./gradlew assembleRelease --no-daemon \
          -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

    # Every build, release or not, is named <version>-<commit> so the exact
    # source an artifact came from is legible from its filename
    - name: Stage & Rename Artifacts
      run: |
        HASH=$(git log -1 --pretty=%h)
        APK_NAME="Droidspaces-universal-v${VERSION}-${HASH}.apk"
        TAR_NAME=$(ls droidspaces-v*-*.tar.gz)
        mkdir -p dist
        mv Android/app/build/outputs/apk/release/app-release.apk dist/${APK_NAME}
        mv ${TAR_NAME} droidspaces_*.deb dist/
        (cd dist && sha256sum * > SHA256SUMS)
        echo "APK_FILE=dist/${APK_NAME}" >> $GITHUB_ENV
        echo "TAR_FILE=dist/${TAR_NAME}" >> $GITHUB_ENV

    - name: Generate Telegram Message
      if: github.event_name != 'pull_request'
      run: |
        if [ -n "$TAG" ]; then
          EVENT_TYPE="Official Release"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          EVENT_TYPE="Manual Trigger"
        else
          EVENT_TYPE="Git Push"
        fi
        COMMIT_MSG=$(git log -1 --pretty=format:%s)
        COMMIT_SHA=$(git log -1 --pretty=format:%h)
        COMMIT_AUTHOR=$(git log -1 --pretty=format:%an)
        {
          echo "TELEGRAM_MESSAGE<<EOF"
          echo "**Droidspaces Build Successful**"
          echo ""
          echo "**Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})"
          echo "**Branch:** ${{ github.ref_name }}"
          echo "**Author:** $COMMIT_AUTHOR"
          echo "**Event:** $EVENT_TYPE"
          echo "**Commit SHA:** [$COMMIT_SHA](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
          echo ""
          echo "**Commit Message:**"
          echo ""
          echo "\`\`\`"
          echo "$COMMIT_MSG"
          echo "\`\`\`"
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Upload Final Artifacts (APK, Tarball & Debian Packages)
      uses: actions/upload-artifact@v4
      with:
        name: droidspaces-artifacts
        path: dist/
        if-no-files-found: error
        retention-days: 14

    - name: Send Telegram Notification
      if: |
        github.event_name != 'pull_request' &&
        env.HAS_TELEGRAM == 'true'
      uses: xz-dev/TelegramFileUploader@v1
      with:
        to-who: ${{ secrets.TELEGRAM_TO }}
        message: ${{ env.TELEGRAM_MESSAGE }}
        files: |
          ${{ env.APK_FILE }}
          ${{ env.TAR_FILE }}
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

    # Every commit since the previous tag, pull requests included, so GitHub's
    # own notes, which list only pull requests, are not wanted on top. On a tag
    # push HEAD is the tag, so the previous one is found from its parent; a
    # manual run for a tag not made yet ends at HEAD
    - name: Generate Changelog
      if: env.TAG != ''
      run: |
        END=HEAD
        git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null && END="${TAG}"
        PREV=$(git describe --tags --abbrev=0 "${END}^" 2>/dev/null || true)
        echo "Previous tag: ${PREV:-none}"
        {
          echo "## What's Changed"
          git log --no-merges --pretty=format:"* %s (%h)" ${PREV:+${PREV}..}${END}
          echo
          echo
          echo "---"
          echo "**Automated Release by Droidspaces CI**"
        } > dist/CHANGELOG.md

    - name: Publish GitHub Release
      if: env.TAG != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG }}
        name: Droidspaces ${{ env.TAG }}
        target_commitish: ${{ github.sha }}
        files: |
          dist/*.apk
          dist/*.tar.gz
          dist/*.deb
          dist/SHA256SUMS
        body_path: dist/CHANGELOG.md
        draft: false
        prerelease: false

    # The site reads the latest release only when it builds. A release made with
    # GITHUB_TOKEN starts no other workflow, so tell the site from here.
    - name: Rebuild droidspaces.org
      if: env.TAG != ''
      env:
        GH_TOKEN: ${{ secrets.WEBPAT }}
      run: gh api repos/droidspaces/droidspaces.github.io/dispatches -f event_type=docs-updated
